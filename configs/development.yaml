app:
  name: "chat-gateway"
  version: "1.0.0"
  debug: true

server:
  host: "0.0.0.0"
  port: "8080"
  timeout: 30
  use_https: false
  cert_path: ""
  key_path: ""

grpc:
  host: "0.0.0.0"
  port: "8081"

database:
  mongo:
    url: "${MONGODB_URI}"
    database: "chatroom"
    username: ""
    password: ""
    max_pool_size: 100
    min_pool_size: 5
    max_conn_idle_time: 30
    connect_timeout: 10
    server_selection_timeout: 5
    tls_enabled: false
    tls_ca_file: ""
    tls_cert_file: ""
    tls_key_file: ""
    tls_insecure_skip_verify: false

log:
  level: "info"

security:
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""

  authentication:
    jwt_enabled: false
    jwt_secret: ""
    expiration: "15m"

  encryption:
    enabled: true
    algorithm: "AES-256-GCM"
    key_length: 256
    kek_keyset: "${CRYPTO_KEK_KEYSET}"
    master_key: "${MASTER_KEY}"

  audit:
    enabled: true
    level: "INFO"

  key_rotation:
    enabled: ${KEY_ROTATION_ENABLED}
    rotation_interval_hours: ${KEY_ROTATION_INTERVAL_HOURS}
    max_key_age_days: ${KEY_ROTATION_MAX_AGE_DAYS}
    keep_old_keys: ${KEY_ROTATION_KEEP_OLD_KEYS}

limits:
  request:
    max_body_size: 10485760
    max_multipart_memory: 10485760
  rate_limiting:
    enabled: true
    default_per_minute: 600
    messages_per_minute: 60
    rooms_per_minute: 30
    sse_per_minute: 300
    cleanup_interval_minutes: 10
  sse:
    max_connections_per_ip: 10
    max_total_connections: 10000
    min_connection_interval_seconds: 1
    heartbeat_interval_seconds: 15
    cleanup_interval_minutes: 10
    initial_message_fetch: 50
    message_channel_buffer: 10
  pagination:
    default_page_size: 20
    max_page_size: 100
    max_history_size: 50
  room:
    max_members: 1000
    max_name_length: 100
  message:
    max_length: 10000
    channel_buffer: 10
